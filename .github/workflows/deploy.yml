name: 노션에서 빌드해 배포

on:
  schedule:
    - cron: "0 0 * * *" # 매일 오전 9시 (한국 시간)
  workflow_dispatch: # Actions 탭의 "Run workflow" 버튼으로 바로 실행
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 노션 데이터 굽기
        run: node scripts/build.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
